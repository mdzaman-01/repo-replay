[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-replay"
version = "0.1.0"
description = "Turn any git repository's history into a shareable, interactive animation. One command, zero dependencies, everything stays local."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["git", "visualization", "history", "animation", "gource", "repository"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Multimedia :: Graphics :: Presentation",
  "Environment :: Console",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mdzaman-01/repo-replay"
Demo = "https://mdzaman-01.github.io/repo-replay/demo.html"
Issues = "https://github.com/mdzaman-01/repo-replay/issues"

[project.scripts]
repo-replay = "repo_replay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repo_replay = ["assets/*"]
