<div id="tip" role="tooltip" hidden></div>

<aside id="panel" aria-label="Statistics" hidden>
  <section>
    <h2>So far</h2>

      <div><dt>Commits</dt><dd id="s-commits">0</dd></div>
      <div><dt>Files</dt><dd id="s-files">0</dd></div>

  </section>
  <section>
    <h2>Languages</h2>

<div id="toast" role="status" aria-live="polite"></div>

<footer id="bar">
  <div class="group">
    <button id="play" class="primary" aria-label="Play" title="Play / pause (Space)"></button>
    <button id="prev" aria-label="Previous commit" title="Previous commit (Left arrow)"></button>
    <button id="next" aria-label="Next commit" title="Next commit (Right arrow)"></button>
    <label class="speed" title="Playback speed (+ / -)">

      <select id="speed">
        <option value="0.25">0.25x</option>
        <option value="0.5">0.5x</option>
        <option value="1" selected>1x</option>
        <option value="2">2x</option>
        <option value="4">4x</option>
        <option value="8">8x</option>
      </select>
    </label>
  </div>
  <div class="scrub">
    <canvas id="spark" aria-hidden="true"></canvas>
    <input id="seek" type="range" min="0" max="1" value="0" step="1" aria-label="Position in history">
  </div>
  <div class="group">
    <button id="btn-labels" class="toggle" aria-pressed="true" title="Folder labels (L)">Labels</button>
    <button id="btn-cam" class="toggle" aria-pressed="true" title="Camera follows the action (C)">Follow</button>
    <button id="btn-panel" class="toggle" aria-pressed="false" title="Statistics (S)">Stats</button>
    <button id="btn-rec" title="Record the replay as a video (R)">Record</button>
    <button id="btn-full" aria-label="Fullscreen" title="Fullscreen (F)"></button>
  </div>
</footer>
